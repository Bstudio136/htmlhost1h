<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexweg Deployer - Publication Instantanée</title>
    <style>
        :root {
            --primary: #6366f1; /* Indigo */
            --primary-hover: #4f46e5;
            --bg: #0f172a; /* Slate 900 */
            --surface: #1e293b; /* Slate 800 */
            --surface-light: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.1);
            --error: #ef4444;
            --error-bg: rgba(239, 68, 68, 0.1);
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--surface);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 15px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Dropzone Styles */
        .dropzone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: rgba(255,255,255,0.02);
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--primary);
            background-color: rgba(99, 102, 241, 0.05);
        }

        .dropzone-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .dropzone h3 {
            margin-bottom: 5px;
            font-size: 1.1rem;
        }

        .dropzone p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        input[type="file"] {
            display: none;
        }

        /* Textarea Styles */
        textarea {
            width: 100%;
            height: 200px;
            background-color: var(--bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.9rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .file-name {
            margin-top: 15px;
            padding: 10px;
            background-color: var(--bg);
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--success);
            display: none;
            justify-content: space-between;
            align-items: center;
        }

        /* Action Button */
        .deploy-btn {
            width: 100%;
            background: linear-gradient(to right, var(--primary), #8b5cf6);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .deploy-btn:hover {
            opacity: 0.9;
        }

        .deploy-btn:active {
            transform: scale(0.99);
        }

        .deploy-btn:disabled {
            background-color: var(--surface-light);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }

        .deploy-btn.loading .spinner {
            display: inline-block;
        }

        .deploy-btn.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Result Box */
        .result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            display: none;
        }

        .result-box.success {
            display: block;
            background-color: var(--success-bg);
            border: 1px solid var(--success);
        }

        .result-box.error {
            display: block;
            background-color: var(--error-bg);
            border: 1px solid var(--error);
        }

        .result-title {
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-box.success .result-title { color: var(--success); }
        .result-box.error .result-title { color: var(--error); }

        .result-url {
            font-family: monospace;
            font-size: 0.9rem;
            word-break: break-all;
            background-color: var(--bg);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .result-actions {
            display: flex;
            gap: 10px;
        }

        .small-btn {
            background-color: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            flex: 1;
            transition: background 0.2s;
        }

        .small-btn:hover {
            background-color: var(--surface-light);
        }

        .duration-note {
            margin-top: 15px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">Flexweg</div>
            <p class="subtitle">Publiez du HTML instantanément et partagez le lien.</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('code')">📝 Coller le code</button>
            <button class="tab-btn" onclick="switchTab('file')">📂 Fichier HTML</button>
        </div>

        <!-- Tab 1: Code Paste -->
        <div id="tab-code" class="tab-content active">
            <textarea id="htmlInput" placeholder="<!DOCTYPE html>
<html>
<body>
  <h1>Bonjour</h1>
</body>
</html>"></textarea>
        </div>

        <!-- Tab 2: File Upload -->
        <div id="tab-file" class="tab-content">
            <div class="dropzone" id="dropzone">
                <div class="dropzone-icon">⬆️</div>
                <h3>Glissez votre fichier ici</h3>
                <p>ou cliquez pour parcourir</p>
                <input type="file" id="fileInput" accept=".html,.htm">
            </div>
            <div class="file-name" id="fileNameDisplay">
                <span>📄</span>
                <span id="fileLabel">Fichier non sélectionné</span>
                <span onclick="clearFile()" style="cursor: pointer; color: var(--error);">✕</span>
            </div>
        </div>

        <button class="deploy-btn" id="deployBtn" onclick="deploy()">
            <div class="spinner"></div>
            <span class="btn-text">🚀 Déployer sur Flexweg</span>
        </button>

        <div class="result-box" id="resultBox">
            <div class="result-title" id="resultTitle"></div>
            <div class="result-url" id="resultUrl"></div>
            <div class="result-actions">
                <button class="small-btn" onclick="copyLink()">📋 Copier le lien</button>
                <button class="small-btn" onclick="window.open(document.getElementById('resultUrl').innerText, '_blank')">👁️ Ouvrir</button>
            </div>
            <div class="duration-note">⚠️ Ce lien expirera dans 60 minutes.</div>
        </div>
    </div>

    <script>
        const htmlInput = document.getElementById('htmlInput');
        const fileInput = document.getElementById('fileInput');
        const dropzone = document.getElementById('dropzone');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const fileLabel = document.getElementById('fileLabel');
        const deployBtn = document.getElementById('deployBtn');
        const resultBox = document.getElementById('resultBox');
        const resultTitle = document.getElementById('resultTitle');
        const resultUrl = document.getElementById('resultUrl');

        let uploadedFileContent = null;
        let lastDeployedUrl = null;

        // --- TABS LOGIC ---
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`tab-${tabName}`).classList.add('active');
            event.target.classList.add('active');
            
            // Reset result box when switching tabs
            resultBox.className = 'result-box';
        }

        // --- FILE HANDLING ---
        dropzone.addEventListener('click', () => fileInput.click());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                processFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                processFile(e.target.files[0]);
            }
        });

        function processFile(file) {
            if (!file.name.toLowerCase().endsWith('.html') && !file.name.toLowerCase().endsWith('.htm')) {
                alert('Veuillez sélectionner un fichier HTML valide.');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                uploadedFileContent = e.target.result;
                fileLabel.textContent = file.name;
                fileNameDisplay.style.display = 'flex';
            };
            reader.readAsText(file);
        }

        function clearFile() {
            fileInput.value = '';
            uploadedFileContent = null;
            fileLabel.textContent = 'Fichier non sélectionné';
            fileNameDisplay.style.display = 'none';
        }

        // --- DEPLOY LOGIC ---
        async function deploy() {
            let contentToDeploy = '';

            // Determine source: File or Textarea
            if (document.getElementById('tab-file').classList.contains('active') && uploadedFileContent) {
                contentToDeploy = uploadedFileContent;
            } else {
                contentToDeploy = htmlInput.value.trim();
            }

            if (!contentToDeploy) {
                alert('Veuillez fournir du code HTML ou charger un fichier.');
                return;
            }

            // UI State
            deployBtn.disabled = true;
            deployBtn.classList.add('loading');
            resultBox.className = 'result-box'; // Hide result

            try {
                const response = await fetch('https://www.flexweg.com/ai/publish', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ html: contentToDeploy })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Erreur HTTP ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                lastDeployedUrl = data.url;

                if (!lastDeployedUrl) {
                    throw new Error('Réponse du serveur invalide (URL manquante).');
                }

                // Success UI
                resultBox.className = 'result-box success';
                resultTitle.innerHTML = '✅ Déploiement réussi !';
                resultUrl.textContent = lastDeployedUrl;

            } catch (error) {
                console.error("Deployment Error:", error);
                resultBox.className = 'result-box error';
                resultTitle.innerHTML = '❌ Échec du déploiement';
                resultUrl.textContent = error.message;
                // Hide the copy/open buttons on error to avoid confusion
                document.querySelector('.result-actions').style.display = 'none';
            } finally {
                deployBtn.disabled = false;
                deployBtn.classList.remove('loading');
                // Ensure actions are visible for success
                if(resultBox.className.includes('success')) {
                    document.querySelector('.result-actions').style.display = 'flex';
                } else {
                    document.querySelector('.result-actions').style.display = 'none';
                }
            }
        }

        // --- UTILS ---
        function copyLink() {
            if (lastDeployedUrl) {
                navigator.clipboard.writeText(lastDeployedUrl).then(() => {
                    const btn = document.querySelector('.small-btn');
                    const originalText = btn.innerText;
                    btn.innerText = '✅ Copié !';
                    setTimeout(() => btn.innerText = originalText, 2000);
                }).catch(err => {
                    alert('Erreur lors de la copie.');
                });
            }
        }
    </script>
</body>
</html>
